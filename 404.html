<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | Utah Glizzies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800;900&family=Inter:wght@400;600;700;800;900&family=Racing+Sans+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260909d" />
    <style id="presale-sticky-css">
    :root { --presale-h: 44px; }
    .presale-top-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--gold, #c19a2c); color: #2b1a10;
      padding: 10px clamp(18px,4vw,48px);
      box-shadow: 0 2px 10px rgba(43, 26, 16, 0.25);
    }
    .presale-top-inner {
      display: flex; align-items: center; gap: 12px;
      max-width: 1200px; margin: 0 auto; flex-wrap: wrap;
    }
    .presale-badge {
      background: #2b1a10; color: var(--gold, #c19a2c);
      font-family: monospace; font-size: 10px; font-weight: 700;
      letter-spacing: 0.15em; padding: 2px 8px; border-radius: 4px;
      text-transform: uppercase; flex-shrink: 0;
    }
    .presale-text { font-size: 14px; font-weight: 600; flex: 1; min-width: 180px; }
    .presale-cta {
      background: #2b1a10; color: var(--gold, #c19a2c);
      padding: 6px 16px; border-radius: 999px; text-decoration: none;
      font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
      transition: background 0.15s;
    }
    .presale-cta:hover { background: #0a1a0d; }
    .presale-close {
      background: none; border: none; cursor: pointer; font-size: 1.2rem;
      color: rgba(43, 26, 16, 0.5); padding: 0 4px; flex-shrink: 0; line-height: 1;
    }
    .presale-close:hover { color: #2b1a10; }
    /* push everything down by the banner height */
    body { padding-top: var(--presale-h); }
    .site-header { top: var(--presale-h) !important; }
    .countdown-bar { top: calc(var(--presale-h) + 88px) !important; }
    @media (max-width: 480px) {
      .presale-text { font-size: 12px; }
      .presale-cta { font-size: 11px; padding: 5px 12px; }
    }
  </style>
</head>
  <body>
  <!-- SITE ANNOUNCEMENT BANNER (edit text in scripts/site-banner.py) -->
  <div class="presale-top-banner" id="presale-banner">
    <div class="presale-top-inner">
      <span class="presale-badge">NOW OPEN</span>
      <span class="presale-text">🌭 Grandma's House is open. Come sit at the table and enjoy a glizzy. <strong>Welcome to the fam.</strong></span>
      <a href="shop.html" class="presale-cta">Shop Now &rarr;</a>
      <button class="presale-close" type="button" aria-label="Close">&times;</button>
    </div>
  </div>
    <main class="not-found">
      <img src="assets/glizzies-logo.png?v=20260909" alt="Utah Glizzies logo" decoding="async" />
      <p class="eyebrow">404</p>
      <h1>Wrong Rink.</h1>
      <p>This page is not here, but the Glizzies are still skating.</p>
      <a class="button primary" href="/">Back Home</a>
    </main>
    <script id="presale-sticky-js">
  (function(){
    function setH(){
      var b=document.getElementById('presale-banner');
      var h=(b && b.style.display!=='none') ? b.offsetHeight : 0;
      document.documentElement.style.setProperty('--presale-h', h+'px');
    }
    function init(){
      var b=document.getElementById('presale-banner');
      if(b){
        var c=b.querySelector('.presale-close');
        if(c) c.addEventListener('click', function(){ b.style.display='none'; setH(); });
      }
      setH();
    }
    window.addEventListener('resize', setH);
    if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('load', setH);
  })();
  </script>
</body>
</html>
